<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일지 정리표</title>
<link rel="stylesheet" href="fonts/pretendard/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="log-first.css?v=3.25.0">
</head>
<body>
<div class="lf-shell">
 <header class="lf-head">
  <div class="lf-title">
   <h1>일지 정리표</h1>
   <p>상담일지를 한 줄씩 정리해 계획서·평가서의 근거로 씁니다</p>
  </div>
  <a class="lf-btn" href="./">← 이전 화면</a>
 </header>

 <ol class="lf-steps noprint" aria-label="작성 단계">
  <li class="done"><span>①</span>회원 등록</li>
  <li class="done"><span>②</span>상담일지 넣기</li>
  <li class="now" aria-current="step"><span>③</span>일지 정리표</li>
  <li class="later"><span>④</span>목표 고르기</li>
  <li class="later"><span>⑤</span>계획서</li>
  <li class="later"><span>⑥</span>평가서</li>
  <li class="later"><span>⑦</span>최종 검토</li>
 </ol>

 <section class="lf-bar noprint">
  <label>회원 <select id="lfMember" aria-label="회원 선택"></select></label>
  <label>정리 기간 <input type="date" id="lfStart" aria-label="기간 시작"></label>
  <span class="lf-tilde">~</span>
  <label class="lf-nolabel"><input type="date" id="lfEnd" aria-label="기간 끝"></label>
  <span class="lf-grow"></span>
  <button class="lf-btn" data-act="load-backup">백업 파일 불러오기</button>
  <button class="lf-btn" data-act="sheet-export">정리표 백업</button>
  <button class="lf-btn" data-act="sheet-import">정리표 불러오기</button>
  <button class="lf-btn primary" data-act="print">요약표 인쇄</button>
  <input type="file" id="lfBackupFile" accept=".json,application/json" hidden>
  <input type="file" id="lfSheetFile" accept=".json,application/json" hidden>
 </section>

 <div id="lfNotice" class="lf-notice" role="status" aria-live="polite"></div>

 <div class="lf-layout">
  <main id="lfNotes" class="lf-notes"></main>
  <aside id="lfSummary" class="lf-summary"></aside>
 </div>

 <section id="lfPrint" class="lf-print" aria-hidden="true"></section>
</div>
<dialog id="lfPw" class="lf-dialog">
 <form method="dialog">
  <h2>암호화 백업 비밀번호</h2>
  <p>백업을 만들 때 정한 비밀번호를 넣으세요.</p>
  <input type="password" id="lfPwInput" autocomplete="off" aria-label="비밀번호">
  <div class="lf-dialog-btns"><button class="lf-btn" value="cancel">취소</button><button class="lf-btn primary" value="ok">열기</button></div>
 </form>
</dialog>
<script src="log-first.js?v=3.25.0" defer></script>
</body>
</html>
