# 자동 검사: main에 올릴 때마다(또는 Actions 화면의 ‘Run workflow’로) 가상 자료로 모든 시험을 돌린다.
# 실제 Gemini·인터넷에는 접속하지 않고, API 키 같은 비밀값도 쓰지 않는다.
# 결과는 GitHub 저장소의 Actions 탭에서 볼 수 있다(초록색 ✓ = 모두 통과, 빨간색 ✗ = 실패한 시험 있음).
name: 자동 검사
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: 시험 실행
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Node.js 22 준비
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: 문법 확인
        run: |
          for f in app.js hwp-paste.js doctor-letter.js pro-knowledge.js document-check.js api/*.js api/*.cjs tests/*.js; do node --check "$f"; done
      - name: 필요한 프로그램 설치 (시험용 jsdom은 배포에 넣지 않음)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund jsdom@24.1.3
      - name: 시험 실행
        run: npm test
