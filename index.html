/* v3.21.58 불러오기 칸: 찾기·목록 정리·고정 · 과거 문서 공통 적용 */
.carry-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.carry-top input[type=search]{width:260px;max-width:100%;background:#fff;border:1px solid #c4d0d8;border-radius:6px;padding:7px 10px;color:#24343e}
.carry-top .grow{flex:1}
.carry-tools{display:inline-flex;gap:4px;flex:0 0 auto;align-items:center}
.carry-tools .btn.small{padding:3px 8px}
.carry-count{font-size:12px;color:#25566a;font-weight:700}
.carry-pin{margin:4px 0 10px;font-size:12px;color:#25566a;background:#eef5f6;border:1px solid #c9dadf;border-radius:8px;padding:6px 9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.legacy-auto-settings{background:#f3f8f9;border:1px solid #d3e2e7;border-radius:8px;padding:8px 10px}
.legacy-auto-settings input[type=checkbox]{width:18px;height:18px;accent-color:#286d87}
#legacyHwpPaste{background:#fbfdfd;border-style:dashed}
.model-pick{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.model-pick select{width:auto;min-width:200px}
@media(max-width:770px){.carry-top input[type=search]{width:100%}.carry-tools{flex:1 1 100%;justify-content:flex-end}}
@media print{.carry-panel,.factor-chips{display:none!important}}
/* v3.21.59 정신과적 진단·증상 */
.psy-filter{border:1px solid #c9d8de;border-radius:10px;background:#f6fafb;margin:0 0 12px}
.psy-filter>summary{cursor:pointer;padding:10px 13px;color:var(--navy)}
.psy-filter[open]>summary{border-bottom:1px solid var(--line)}
.psy-filter:not([open])>summary::after{content:'눌러서 펼치기';margin-left:8px;font-size:11px;color:var(--blue)}
.psy-body{padding:10px 13px 12px}
.psy-options{display:flex;gap:8px 18px;flex-wrap:wrap;margin:8px 0}
.psy-options input{width:17px;height:17px;accent-color:#286d87}
#psyCustom{max-width:340px;min-width:180px;flex:1}
.psy-body .token .btn.plain{padding:0 2px;text-decoration:none;font-weight:700}
.shared-legacy{margin:16px 0}
/* v3.21.59 주치의편지(회원경과보고 3쪽) */
.doctor-paper{display:flex;flex-direction:column;gap:22px;align-items:center;background:transparent;padding:6px 0}
.doctor-sheet{width:100%;max-width:794px;background:#fff;color:#172229;border:1px solid #60717a;box-shadow:0 2px 12px #2239441f;padding:20px 22px;position:relative}
.doctor-paper .doctor-sheet h2{text-align:center;font-size:22px;letter-spacing:.06em;margin:6px 0 16px}
.doctor-paper .doctor-sheet h3{text-align:center;font-size:15px;letter-spacing:.14em;margin:12px 0}
.doctor-sheet p{line-height:1.55;margin:9px 0;font-size:13px}
.doctor-approval{text-align:right;font-size:12px;margin:0 0 16px}
.doctor-paper .doctor-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px;margin:0 0 10px}
.doctor-paper .doctor-table th,.doctor-paper .doctor-table td{border:1px solid #363e42;padding:5px 7px;vertical-align:middle;overflow-wrap:anywhere}
.doctor-paper .doctor-table th{background:#f4dca8;font-weight:700}
.doctor-paper .doctor-table th.doctor-left{text-align:left}
.doctor-paper .doctor-table .doctor-group{background:#f4dca8;font-weight:700;text-align:center}
.doctor-table textarea,.doctor-table input,.doctor-table select{width:100%;min-width:0;font-size:12px;background:transparent;border:1px solid #d2d9db;border-radius:3px;padding:4px;line-height:1.4;color:#172229}
.doctor-table textarea{min-height:54px;resize:vertical}
.doctor-table th input{display:inline-block;width:55%;font-weight:400}
.doctor-table td .btn.small{margin-top:4px}
.doctor-head th{width:18%}
.doctor-foot{margin-top:16px}
.doctor-reply .doctor-table{margin-top:28px}
.doctor-reply textarea[data-doctor-field="doctorReply"]{min-height:420px}
.doctor-bottom{text-align:right;font-weight:600}
.doctor-page-label{position:absolute;bottom:8px;right:22px;font-size:11px;color:#64747b}
.doctor-history{border:1px solid #c9d8de;border-radius:10px;background:#f7fbfc;margin:16px 0;padding:0 0 6px}
.doctor-history>summary{cursor:pointer;padding:10px 13px;color:var(--navy)}
.doctor-history>*:not(summary){margin-left:13px;margin-right:13px}
@media(max-width:740px){.doctor-sheet{padding:11px 9px}.doctor-paper .doctor-table{font-size:11px}.doctor-paper .doctor-table th,.doctor-paper .doctor-table td{padding:3px}.doctor-table textarea,.doctor-table input,.doctor-table select{font-size:11px}.doctor-reply textarea[data-doctor-field="doctorReply"]{min-height:260px}.doctor-table th input{width:100%}}
@media print{.doctor-paper#printSheet{display:block!important;gap:0;padding:0}.doctor-sheet{box-shadow:none;border:0;max-width:none;padding:0;break-after:page;page-break-after:always}.doctor-sheet:last-child{break-after:auto;page-break-after:auto}.doctor-page-label{position:static;text-align:right;margin-top:6px}.doctor-paper .doctor-table th,.doctor-paper .doctor-table .doctor-group{print-color-adjust:exact;-webkit-print-color-adjust:exact}.doctor-paper .doctor-table td,.doctor-paper .doctor-table th{vertical-align:top}.doctor-reply .printvalue[data-doctor-field="doctorReply"]{min-height:400px}.doctor-paper .doctor-table th .printvalue{display:inline;font-weight:400}}
/* v3.21.60 찾은 전문자료 */
.pro-box{border:1px solid #cfdcc9;border-radius:10px;background:#f7faf5;margin:10px 0;padding:0}
.pro-box>summary,.pro-box>b{display:block;cursor:pointer;padding:9px 13px;color:#2f5a2a}
div.pro-box{padding:9px 13px}div.pro-box>b{padding:0;cursor:default}
.pro-box[open]>summary{border-bottom:1px solid #dfe8da}
.pro-box>p,.pro-box>ul{margin:8px 13px}
.pro-box ul{padding-left:18px}.pro-box li{margin:0 0 8px;font-size:13px;line-height:1.55}
.pro-box a{color:var(--blue)}
/* v3.21.61 구글 검색으로 찾은 전문자료 */
.pro-web{margin:8px 13px;padding-top:8px;border-top:1px dashed #cfdcc9}
.pro-web>p{margin:6px 0;font-size:13px;line-height:1.55}
.pro-web .btn.small{margin-left:6px}
.pro-web-text{white-space:pre-wrap;background:#fff;border:1px solid #dfe8da;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.6;max-height:420px;overflow:auto;overflow-wrap:anywhere}
.pro-gs{margin:6px 0;width:100%;overflow-x:auto;contain:inline-size}
/* v3.21.64: 한글 문서에서 붙여넣기(재활계획서·재활평가서) */
.hwp-doc{border:1px dashed #9fbccb;border-radius:10px;background:#f7fbfc;padding:9px 12px;margin:0 0 12px}
.hwp-doc>label{display:block;margin:0 0 6px;line-height:1.55}
.hwp-doc>label .muted{font-size:12px}
.hwp-doc textarea.hwp-doc-drop{min-height:42px;height:auto;resize:none;background:#fff;border:1px dashed #9fbccb;border-radius:7px;font-size:12px;padding:8px 10px;overflow:hidden}
.hwp-doc textarea.hwp-doc-drop:focus{border-style:solid;border-color:var(--blue);outline:none}
.hwp-doc.drag{background:#e9f5f4;border-color:#479b92}
.hwp-doc-msg{margin-top:8px;font-size:12px;color:var(--navy);line-height:1.6;overflow-wrap:anywhere}
.hwp-doc-msg ul{margin:4px 0 6px 18px;padding:0;color:#87611e}
.hwp-doc-msg .btn{margin-top:4px}
@media print{.hwp-doc{display:none!important}}
</style>
